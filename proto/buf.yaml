version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Service names are the public vocabulary (PackageRegistry,
    # Entitlement, TenantStorage, EgressProxy, AuditLog) verbatim - not
    # renaming away from the established names for a lint default.
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
