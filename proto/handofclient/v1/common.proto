syntax = "proto3";

package handofclient.v1;

option csharp_namespace = "HandOfClient.V1";

// TenantScope is the {host, tenant, package} triple every tenant-owned
// resource in the platform is keyed by. Present on every message that reads
// or writes tenant data.
message TenantScope {
  string host_id = 1;
  string tenant_id = 2;
  string package_id = 3;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}
