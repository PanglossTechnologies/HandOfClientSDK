name: release

# Tag vX.Y.Z -> GitHub release with the prebuilt host-side embed.js attached, so integrators can
# download it instead of building this repo.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  embed-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp sdk/embed-js/dist/embed.global.js embed.global.js
          cp sdk/embed-js/dist/hoc-head.min.js hoc-head.min.js
          sha256sum embed.global.js > embed.global.js.sha256
          gh release create "$GITHUB_REF_NAME" embed.global.js embed.global.js.sha256 hoc-head.min.js \
            --title "$GITHUB_REF_NAME" --generate-notes

  # npm publish via Trusted Publishing (OIDC, no stored token). Needs a trusted publisher configured on
  # npmjs.com for each package: repo PanglossTechnologies/HandOfClientSDK, workflow release.yml.
  # Versioned from the tag like the nuget job: tag v0.2.0 publishes all three at 0.2.0 (their dependencies on
  # each other pinned to 0.2.0); a prerelease tag (v0.2.0-rc.1) publishes under the "next" dist-tag.
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Set package versions from the tag (fails on a malformed tag)
        id: version
        run: node tools/ci/set-npm-release-version.mjs "$GITHUB_REF_NAME"
      - run: npm run build
      - name: Publish ${{ steps.version.outputs.version }}
        run: >
          npm publish -w @handofclient/gen-ts -w @handofclient/api -w @handofclient/embed-js
          --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"

  # HOCSDK-2: NuGet HandOfClient.Client, versioned from the tag (the csproj leaves PackageVersion to this job).
  # Needs the repo secret NUGET_API_KEY (nuget.org key scoped to HandOfClient.Client). Without it the push
  # step fails loudly rather than skipping.
  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack HandOfClient.Client
        run: >
          dotnet pack clients/csharp/HandOfClient.Client/HandOfClient.Client.csproj
          -c Release -p:PackageVersion="${GITHUB_REF_NAME#v}" -o dist/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/nuget/*.nupkg
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "dist/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
